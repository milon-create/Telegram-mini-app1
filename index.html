<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram Mini App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
}
.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  background:#020617;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:360px;
  text-align:center;
}
h1{font-size:22px;}
.balance{
  margin:15px 0;
  font-size:18px;
  color:#22c55e;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
}
.small{font-size:12px;opacity:0.7;margin-top:10px;}
</style>
</head>

<body>
<div class="container">
  <div class="box">
    <h1>💰 Mini App Income</h1>
    <div id="user">Loading...</div>

    <div class="balance">
      Balance: <span id="bal">0</span> Coins
    </div>

    <button onclick="doTask()">🔗 Complete Task</button>
    <button onclick="withdraw()">🏦 Withdraw</button>

    <div class="small">
      Demo system – real earning next
    </div>
  </div>
</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

let balance = 0;
let user = Telegram.WebApp.initDataUnsafe.user;

document.getElementById("user").innerText =
  user ? "Hello, " + user.first_name : "Open from Telegram";

function doTask(){
  // Example shortlink
  Telegram.WebApp.openLink("https://example.com");
  balance += 10;
  document.getElementById("bal").innerText = balance;
}

function withdraw(){
  if(balance >= 50){
    Telegram.WebApp.showAlert("Withdraw request sent!");
    balance = 0;
    document.getElementById("bal").innerText = balance;
  }else{
    Telegram.WebApp.showAlert("Minimum 50 coins required");
  }
}
</script>
</body>
</html>
