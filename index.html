<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram Mini App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
}
.header{
  padding:16px;
  text-align:center;
  background:#020617;
  font-size:20px;
}
.card{
  background:#020617;
  margin:16px;
  padding:16px;
  border-radius:12px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
.small{
  font-size:14px;
  opacity:0.7;
}
</style>
</head>

<body>

<div class="header">🚀 Telegram Mini App</div>

<div class="card">
  <p id="user" class="small">User not loaded</p>
  <button onclick="loadUser()">Load My Profile</button>
</div>

<div class="card">
  <p class="small">💰 Income system coming next</p>
</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

function loadUser(){
  let user = Telegram.WebApp.initDataUnsafe.user;
  if(user){
    document.getElementById("user").innerHTML =
      "Name: " + user.first_name + "<br>ID: " + user.id;
  }else{
    document.getElementById("user").innerText =
      "Please open this app from Telegram";
  }
}
</script>

</body>
</html>
